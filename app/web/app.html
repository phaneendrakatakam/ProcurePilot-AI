<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ProcurePilot</title>
  <meta name="description" content="ProcurePilot role-aware procurement operations platform" />
  <link rel="stylesheet" href="/static/css/app.css?v=20261009-e2e-repairs" />
  <link rel="stylesheet" href="/static/css/supplier-selection.css?v=20260919-v1-selection" />
  <link rel="stylesheet" href="/static/css/approval-workspace.css?v=20260919-v1-approval" />
  <link rel="stylesheet" href="/static/css/purchase-order.css?v=20260924-purchase-order-po" />
</head>
<body class="app-page">
  <div id="app-loading" class="app-loading">
    <div class="loading-mark">P</div>
    <strong>ProcurePilot</strong>
    <span>Loading your workspace…</span>
  </div>

  <div id="app-shell" class="app-shell" hidden>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand brand">
        <span class="brand-mark" aria-hidden="true">P</span>
        <span><strong>ProcurePilot</strong> </span>
      </div>
      <div class="sidebar-context">
        <span class="eyebrow">WORKSPACE</span>
        <strong id="workspace-name">ProcurePilot Workspace</strong>
      </div>
      <nav id="sidebar-nav" class="sidebar-nav" aria-label="Primary navigation"></nav>
      <div class="sidebar-bottom">
        <div class="ops-card">
          <span class="spark">✦</span>
          <strong>Controlled procurement, end to end.</strong>
          <p>Less manual work. More traceable progress.</p>
        </div>
        <button id="logout-button" class="sidebar-link sidebar-link--button" type="button">
          <span aria-hidden="true">↪</span><span>Sign out</span>
        </button>
      </div>
    </aside>

    <div class="app-main">
      <header class="topbar">
        <button id="mobile-menu-button" class="icon-button mobile-only" aria-label="Open navigation">☰</button>
        <div class="global-search">
          <span aria-hidden="true">⌕</span>
          <input id="global-search" type="search" placeholder="Search ProcurePilot…" aria-label="Search ProcurePilot" />
          <kbd>/</kbd>
        </div>
        <div class="topbar-actions">
          <button class="icon-button notification-button" type="button" title="Notifications" aria-label="Notifications">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <span class="notification-dot" aria-hidden="true"></span>
          </button>
          <div class="profile-chip">
            <span id="profile-initials" class="profile-avatar">PP</span>
            <span class="profile-copy"><strong id="profile-name">Loading…</strong><small id="profile-role">—</small></span>
          </div>
        </div>
      </header>

      <main id="content" class="content" tabindex="-1"></main>
    </div>
  </div>

  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <div id="modal-root"></div>
  <script src="/static/js/app.js?v=20261009-procure-e2e" defer></script>
</body>
</html>
